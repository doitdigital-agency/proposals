name = "did-proposals"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
account_id = "afee90ac807c87809cb5308b93c13c74"

# Static decks: synced from the proposals repo clone by _tools/deploy-proposals.sh (excludes _* folders, *.md, tracking/).
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# proposals.doitdigital.agency: Cloudflare creates the DNS record and certificate on deploy.
[[routes]]
pattern = "proposals.doitdigital.agency"
custom_domain = true

# Secrets (set with `wrangler secret put`, never committed):
#   COOKIE_SECRET  random 32-byte hex, signs the unlock cookies
#   PASSWORDS      JSON: {"hypr": {"password": "...", "title": "LinkedIn Outbound for HYPR"}, "bonfire": "plain-password-also-ok"}
#                  Decks not listed are served without a password.
